services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: travelmap
      POSTGRES_USER: travelmap
      POSTGRES_PASSWORD: travelmap_local
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelmap -d travelmap"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - travelmap_postgres_data:/var/lib/postgresql/data

volumes:
  travelmap_postgres_data:
